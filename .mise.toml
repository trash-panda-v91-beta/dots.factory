[env]
_.fnox-env = { tools = true }

[plugins]
fnox-env = "https://github.com/jdx/mise-env-fnox"

[tools]
actionlint = "1.7.12"
fnox = "1.33.0"
hk = "1.55.0"
pkl = "0.32.1"
"github:tombi-toml/tombi" = "1.4.0"
yamlfmt = "0.21.0"
rumdl = "0.2.55"
yamllint = "1.38.0"
shellcheck = "latest"
shfmt = "latest"

[settings]
env_shell_expand = true

[settings.pipx]
uvx = true

[tasks.check]
description = "Run all checks"
run = [
  "hk check",
  "nix flake check --no-build",
]

[tasks.fix]
description = "Run all fixers and formatters"
run = "hk fix"

[tasks.test]
description = "Run tests (none configured yet)"
run = "echo no tests configured"
