---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deps Update

# Bumps non-flake sources - npins pins and pi-* FOD hashes -
# and opens a PR. Flake inputs (nixpkgs, home-manager, den, etc.) are
# handled by Renovate; this workflow only owns what Renovate can't see:
#   npins/sources.json (pi-*, ponytail, context7-pi, plugins, Obsidian)
#   and the outputHash lines in the pi-* FOD packages.

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  update:
    name: Bump npins, Obsidian, pi-* Hashes
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      packages: read
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          client-id: ${{ vars.TRASHBOT_APP_ID }}
          private-key: ${{ secrets.TRASHBOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-update-${{ hashFiles('flake.lock', 'npins/sources.json') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-update-
          gc-max-store-size-macos: 5G

      - name: Bump deps and open PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VAULT_READ_TOKEN: ${{ secrets.VAULT_READ_TOKEN }}
        run: |
          git config user.name  "trashbot[bot]"
          git config user.email "trashbot[bot]@users.noreply.github.com"

          branch="deps/npins-$(date '+%F')"
          git checkout -b "$branch"

          (
            echo '### npins update'
            echo '```'
            nix run nixpkgs#npins -- update 2>&1
            echo '```'
            echo '### pi-* hashes'
            echo '```'
            mise run refresh-hashes 2>&1
            echo '```'
          ) | tee /tmp/pr-body.md

          GH_TOKEN="$VAULT_READ_TOKEN" mise run check

          git add npins/sources.json packages/

          if git diff --cached --quiet; then
            echo "No changes - nothing to PR"
            exit 0
          fi
          git commit -m "chore(deps): bump npins + pi-* hashes"
          git push origin "$branch" --force

          gh pr create \
            --title "chore(deps): bump npins + pi-* hashes" \
            --body-file /tmp/pr-body.md \
            --label npins/update \
            --head "$branch"
